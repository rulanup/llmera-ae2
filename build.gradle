plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = rootProject.mod_version
group = rootProject.mod_group_id

base {
    archivesName = 'llmera-ae2'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
}

neoForge {
    version = rootProject.neo_version

    parchment {
        mappingsVersion = rootProject.parchment_mappings_version
        minecraftVersion = rootProject.parchment_minecraft_version
    }

    mods {
        llmera_ae2 {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation project(':')
    compileOnly 'org.appliedenergistics:appliedenergistics2:19.2.17:api'
    localRuntime 'org.appliedenergistics:appliedenergistics2:19.2.17'
    compileOnly "maven.modrinth:jade:${rootProject.jade_version}"
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: rootProject.minecraft_version_range,
            neo_version: rootProject.neo_version,
            loader_version_range: rootProject.loader_version_range,
            mod_version: rootProject.mod_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
